name: Check configuration schema changes

on:
  pull_request:
    branches:
      - main
    paths:
      - 'server/package.json'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  update-settings:
    uses: sublimelsp/workflows/.github/workflows/update-settings.yaml@v3
    secrets:
      SUBLIMELSP_APP_PRIVATE_KEY: ${{ secrets.SUBLIMELSP_APP_PRIVATE_KEY }}
